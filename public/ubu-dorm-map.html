<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBU Dynamic Routing - ระบบนำทางหอพักและประตู ม.อุบลฯ (เลือกจุดอิสระ)</title>
    
    <!-- 1. Leaflet CSS & Google Fonts -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: #f8fafc;
            overflow: hidden;
        }

        #map {
            width: 100vw;
            height: 100vh;
            background: #f1f5f9;
        }

        /* 1. CSS Filter ย้อมสีเลเยอร์แผนที่ OSM ให้เป็นสีเทาสว่าง มินิมอล สบายตา */
        #map .leaflet-tile-pane {
            filter: grayscale(100%) opacity(60%) contrast(120%);
        }

        /* ซ่อนกล่อง Attribution เพื่อความคลีน 100% */
        .leaflet-control-attribution {
            display: none !important;
        }

        /* หมุดตำแหน่ง GPS ของคุณ */
        .custom-gps-pin {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gps-ping {
            position: absolute;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.35);
            animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        .gps-core {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #1a73e8;
            border: 2.5px solid #ffffff;
            box-shadow: 0 0 12px rgba(26, 115, 232, 0.8);
            z-index: 2;
        }

        .gps-tag {
            position: absolute;
            left: 26px;
            background: #1e3a8a;
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1.5px solid #93c5fd;
            white-space: nowrap;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            pointer-events: none;
        }

        /* หมุดหอพักมินิมอล */
        .custom-dorm-marker {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #ffffff;
            color: #0f172a;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            border: 2px solid #0284c7;
            box-shadow: 0 4px 14px rgba(0,0,0,0.18);
            white-space: nowrap;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .custom-dorm-marker.white-dorm {
            border-color: #059669;
            color: #065f46;
        }

        .custom-dorm-marker:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
            z-index: 9999 !important;
        }

        /* หมุดประตูมหาวิทยาลัยอุบลราชธานี */
        .custom-gate-marker {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #1e3a8a;
            color: #fef08a;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            border: 2px solid #93c5fd;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            white-space: nowrap;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: transform 0.2s;
        }

        .custom-gate-marker:hover {
            transform: translate(-50%, -50%) scale(1.1);
            z-index: 9999 !important;
        }

        /* แผงควบคุมเลือกจุดนำทางแบบอิสระ (มุมซ้ายบน) */
        .dynamic-routing-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ffffff;
            padding: 16px;
            border-radius: 24px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.16);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1000;
            border: 1px solid #e2e8f0;
            width: 340px;
            max-width: calc(100vw - 40px);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 8px;
            border-bottom: 1px solid #f1f5f9;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 800;
            color: #1e3a8a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .swap-btn {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }

        .swap-btn:hover {
            background: #2563eb;
            color: #ffffff;
        }

        .select-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .select-label {
            font-size: 11px;
            font-weight: 800;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .custom-select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 12px;
            border: 1.5px solid #cbd5e1;
            font-family: 'Sarabun', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #0f172a;
            background: #f8fafc;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .custom-select:focus {
            border-color: #2563eb;
            background: #ffffff;
        }

        /* การ์ดข้อมูลเส้นทางสไตล์ Google Maps (มุมซ้ายล่าง) */
        .map-route-card {
            position: absolute;
            bottom: 24px;
            left: 20px;
            background: #ffffff;
            padding: 12px 18px;
            border-radius: 16px;
            box-shadow: 0 8px 26px rgba(0,0,0,0.18);
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 1000;
            border: 1px solid rgba(226, 232, 240, 0.95);
        }

        .route-icon-box {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e8f0fe;
            padding: 10px;
            border-radius: 50%;
        }

        .route-time {
            font-size: 18px;
            font-weight: 800;
            color: #1a73e8;
            line-height: 1.2;
        }

        .route-distance {
            font-size: 12px;
            color: #5f6368;
            font-weight: 600;
        }

        @keyframes ping {
            75%, 100% { transform: scale(2); opacity: 0; }
        }
    </style>

        <div class="panel-header">
            <div class="panel-title">
                <span>🚗</span>
                <span>ระบบนำทางรถยนต์ ม.อุบลฯ</span>
            </div>
            <button class="swap-btn" onclick="swapStartAndDestination()" title="สลับจุดเริ่มต้นและจุดหมาย">
                🔄 สลับจุด
            </button>
        </div>

        <!-- 1. จุดเริ่มต้น (Origin) -->
        <div class="select-group">
            <label class="select-label">
                <span style="color: #2563eb;">●</span>
                <span>จุดเริ่มต้น (Origin):</span>
            </label>
            <select id="start-select" class="custom-select" onchange="calculateDynamicRoute()"></select>
        </div>

        <!-- 2. จุดหมายปลายทาง (Destination) -->

            <label class="select-label">
                <span style="color: #ef4444;">●</span>
                <span>จุดหมายปลายทาง (Destination):</span>
            </label>
            <select id="dest-select" class="custom-select" onchange="calculateDynamicRoute()"></select>
        </div>
    </div>

    <!-- 2. Leaflet JS Script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. ตั้งค่าแผนที่และพิกัดเริ่มต้นโซน ม.อุบลฯ (ตำบลเมืองศรีไค)
        let userLocation = [15.1186, 104.9150];
        const map = L.map('map', { 
            zoomControl: false,
            minZoom: 12,
            maxZoom: 19
        }).setView(userLocation, 15);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 2. Base Map: OpenStreetMap (OSM) มาตรฐาน (ฟรี 100% ไร้ API Key)
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Add onClick listener to map for coordinate logging
        map.on('click', function(e) {
            console.log("Map Clicked Coordinates -> Latitude: " + e.latlng.lat + ", Longitude: " + e.latlng.lng);
        });

        // 3. หมุดตำแหน่ง GPS ของผู้ใช้
        const gpsIcon = L.divIcon({
            className: 'custom-gps-pin',
            html: `
                <div class="gps-ping"></div>
                <div class="gps-core"></div>
                <div class="gps-tag">ตำแหน่ง GPS ของคุณ</div>
            `,
            iconSize: [24, 24],
            iconAnchor: [12, 12]
        });
        const gpsMarker = L.marker(userLocation, { icon: gpsIcon, zIndexOffset: 1000 }).addTo(map);

        // ขอพิกัด GPS จริงจากเบราว์เซอร์
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                userLocation = [pos.coords.latitude, pos.coords.longitude];
                gpsMarker.setLatLng(userLocation);
                calculateDynamicRoute();
            });
        }

        // 6. ฟังก์ชันเติมตัวเลือกลงใน Dropdown ทั้ง 2 ตัว (Grouped Options)
        function populateDropdown(selectElem, defaultVal) {
            selectElem.innerHTML = '';

            // Group 1: GPS ปัจจุบัน
            const grpGps = document.createElement('optgroup');
            grpGps.label = '📡 ตำแหน่งปัจจุบัน';
            const optGps = document.createElement('option');
            optGps.value = 'gps';
            optGps.innerText = '📡 ตำแหน่ง GPS ของคุณ';
            grpGps.appendChild(optGps);
            selectElem.appendChild(grpGps);

            // Group 2: ประตูมหาวิทยาลัย (7 จุด)
            const grpGates = document.createElement('optgroup');
            grpGates.label = '🏛️ ประตูมหาวิทยาลัย (7 จุด)';
            ubuGates.forEach(g => {
                const opt = document.createElement('option');
                opt.value = 'gate_' + g.id;
                opt.innerText = '🏛️ ' + g.name;
                grpGates.appendChild(opt);
            });
            selectElem.appendChild(grpGates);

            // Group 3: หอพักเครือข่าย (60 แห่ง)
            const grpDorms = document.createElement('optgroup');
            grpDorms.label = '🏠 หอพักรอบ ม.อุบลฯ (60 แห่ง)';
            dormitories.forEach(d => {
                const opt = document.createElement('option');
                opt.value = 'dorm_' + d.id;
                opt.innerText = (d.isWhiteDorm ? '🛡️ ' : '🏠 ') + d.name;
                grpDorms.appendChild(opt);
            });
            selectElem.appendChild(grpDorms);

            if (defaultVal) selectElem.value = defaultVal;
        }

        const startSelect = document.getElementById('start-select');
        const destSelect = document.getElementById('dest-select');

        populateDropdown(startSelect, 'gps');
        populateDropdown(destSelect, 'gate_A');

        // 7. วนลูปสร้างหมุดประตูมหาวิทยาลัยลงบนแผนที่
        ubuGates.forEach(gate => {
            const gateIcon = L.divIcon({
                className: '',
                html: `<div class="custom-gate-marker">🏛️ ${gate.name}</div>`,
                iconSize: [1, 1],
                iconAnchor: [0, 0]
            });

            const marker = L.marker([gate.lat, gate.lng], { icon: gateIcon }).addTo(map);
            marker.bindPopup(`
                <div style="font-family: 'Sarabun', sans-serif; text-align: center;">
                    <b style="font-size: 14px;">${gate.name}</b><br>
                    <span style="font-size: 11px; color: #1e3a8a; font-weight: bold;">ประตู ม.อุบลฯ</span><br>
                    <div style="display: flex; gap: 4px; margin-top: 6px; justify-content: center;">
                        <button onclick="setAsOrigin('gate_${gate.id}')" style="background: #2563eb; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;">ตั้งเป็นจุดเริ่ม</button>
                        <button onclick="setAsDestination('gate_${gate.id}')" style="background: #059669; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;">นำทางมาที่นี่</button>
                    </div>
                </div>
            `);
        });

        // 8. วนลูปสร้างหมุดหอพักลงบนแผนที่
        dormitories.forEach(dorm => {
            const lat = Number(dorm.lat || dorm.latitude);
            const lng = Number(dorm.lng || dorm.longitude);
            if (!lat || !lng) return;

            const isWhite = Boolean(dorm.isWhiteDorm || dorm.status === 'ผ่าน');
            const iconHtml = `<div class="custom-dorm-marker ${isWhite ? 'white-dorm' : ''}">${isWhite ? '🛡️' : '🏠'} ${dorm.name}</div>`;

            const dormIcon = L.divIcon({
                className: '',
                html: iconHtml,
                iconSize: [1, 1],
                iconAnchor: [0, 0]
            });

            const marker = L.marker([lat, lng], { icon: dormIcon }).addTo(map);
            marker.bindPopup(`
                <div style="font-family: 'Sarabun', sans-serif; text-align: center;">
                    <b style="font-size: 14px;">${dorm.name}</b><br>
                    <span style="font-size: 11px; color: ${isWhite ? '#059669' : '#d97706'}; font-weight: bold;">
                        ${isWhite ? '🛡️ หอพักสีขาว ม.อุบลฯ' : '🏠 หอพักทั่วไป'}
                    </span><br>
                    <div style="display: flex; gap: 4px; margin-top: 6px; justify-content: center;">
                        <button onclick="setAsOrigin('dorm_${dorm.id}')" style="background: #2563eb; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;">ตั้งเป็นจุดเริ่ม</button>
                        <button onclick="setAsDestination('dorm_${dorm.id}')" style="background: #059669; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;">นำทางมาที่นี่</button>
                    </div>
                </div>
            `);
        });

        window.setAsOrigin = function(val) {
            startSelect.value = val;
            calculateDynamicRoute();
        };

        window.setAsDestination = function(val) {
            destSelect.value = val;
            calculateDynamicRoute();
        };

        window.swapStartAndDestination = function() {
            const temp = startSelect.value;
            startSelect.value = destSelect.value;
            destSelect.value = temp;
            calculateDynamicRoute();
        };

        // Helper Resolve พิกัดและชื่อจากค่า Value
        function resolvePointCoords(val) {
            if (val === 'gps') {
                return { lat: userLocation[0], lng: userLocation[1], name: 'ตำแหน่ง GPS ของคุณ' };
            }
            if (val.startsWith('gate_')) {
                const gId = val.replace('gate_', '');
                const gate = ubuGates.find(g => g.id === gId);
                return gate ? { lat: gate.lat, lng: gate.lng, name: gate.name } : null;
            }
            if (val.startsWith('dorm_')) {
                const dId = val.replace('dorm_', '');
                const dorm = dormitories.find(d => String(d.id) === dId);
                return dorm ? { lat: Number(dorm.lat || dorm.latitude), lng: Number(dorm.lng || dorm.longitude), name: dorm.name } : null;
            }
            return null;
        }

        let currentRouteGlow = null;
        let currentRouteCore = null;

        // 9. ฟังก์ชันคำนวณเส้นทางขับรถยนต์อิสระ (OSRM Driving Engine)
        window.calculateDynamicRoute = function() {
            const startPt = resolvePointCoords(startSelect.value);
            const destPt = resolvePointCoords(destSelect.value);

            if (!startPt || !destPt) return;
            if (startPt.lat === destPt.lat && startPt.lng === destPt.lng) {
                document.getElementById('route-time').innerText = '0 นาที';
                document.getElementById('route-distance').innerText = 'จุดเริ่มต้นและปลายทางตรงกัน';
                if (currentRouteGlow) map.removeLayer(currentRouteGlow);
                if (currentRouteCore) map.removeLayer(currentRouteCore);
                return;
            }

            // ส่งพิกัดเข้า OSRM Driving Profile (คำนวณเฉพาะเส้นทางรถยนต์)
            const url = `https://router.project-osrm.org/route/v1/driving/${startPt.lng},${startPt.lat};${destPt.lng},${destPt.lat}?overview=full&geometries=geojson&steps=true&radiuses=150;150`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.code === 'Ok' && data.routes[0]) {
                        const route = data.routes[0];
                        const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);

                        if (currentRouteGlow) map.removeLayer(currentRouteGlow);
                        if (currentRouteCore) map.removeLayer(currentRouteCore);

                        // เส้น Halo เรืองแสง
                        currentRouteGlow = L.polyline(coords, {
                            color: '#1e3a8a',
                            weight: 8,
                            opacity: 0.45,
                            lineCap: 'round',
                            lineJoin: 'round'
                        }).addTo(map);

                        // เส้น Polyline สีฟ้าแกนหลักสำหรับรถยนต์
                        currentRouteCore = L.polyline(coords, {
                            color: '#1a73e8',
                            weight: 5,
                            opacity: 0.95,
                            lineCap: 'round',
                            lineJoin: 'round'
                        }).addTo(map);

                        // FitBounds ให้เห็นครอบคลุมทั้งเส้นทางพอดี (ถ้าผู้ใช้ไม่ได้กำลังลากแผนที่อยู่)
                        const isInteracting = map.dragging && map.dragging.moving();
                        if (!isInteracting) {
                            map.fitBounds(currentRouteCore.getBounds(), { padding: [60, 60] });
                        }

                        // คำนวณระยะทางและเวลาขับรถยนต์จริง
                        const mins = Math.max(1, Math.round(route.duration / 60));
                        const km = (route.distance / 1000).toFixed(1);

                        document.getElementById('route-time').innerText = `${mins} นาที`;
                        document.getElementById('route-distance').innerText = `${km} กม. (ไปยัง ${destPt.name})`;
                    } else {
                        throw new Error('OSRM No route found');
                    }
                })
                .catch(err => {
                    console.error(`ไม่สามารถคำนวณเส้นทางไปยัง "${destPt.name}" ได้ กรุณาตรวจสอบพิกัดของสถานที่นี้`, err);
                    alert(`ไม่สามารถคำนวณเส้นทางไปยัง "${destPt.name}" ได้ กรุณาตรวจสอบพิกัดของสถานที่นี้`);
                });
        };

        // เริ่มต้นคำนวณเส้นทางแรกทันที
        calculateDynamicRoute();
    </script>
