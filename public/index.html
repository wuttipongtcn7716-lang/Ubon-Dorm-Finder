    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #f8fafc;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #eef2f6;
            z-index: 1;
        }

        /* 1. CSS Filter ย้อมสีเลเยอร์แผนที่ OSM ให้เป็นสีเทาสว่าง มินิมอล */
        #map .leaflet-tile-pane {
            filter: grayscale(100%) opacity(60%) contrast(120%);
        }

        /* ซ่อนกล่อง Attribution เพื่อความสะอาดตา 100% */
        .leaflet-control-attribution {
            display: none !important;
        }

        /* หมุดตำแหน่ง GPS ของคุณ */
        .custom-gps-pin {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gps-ping {
            position: absolute;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.35);
            animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        .gps-core {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #1a73e8;
            border: 2.5px solid #ffffff;
            box-shadow: 0 0 12px rgba(26, 115, 232, 0.8);
            z-index: 2;
        }

        .gps-tag {
            position: absolute;
            left: 26px;
            background: #0f172a;
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1.5px solid #93c5fd;
            white-space: nowrap;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            pointer-events: none;
        }

        /* หมุดหอพักมินิมอล */
        .custom-dorm-marker {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #ffffff;
            color: #0f172a;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            border: 2px solid #0284c7;
            box-shadow: 0 4px 14px rgba(0,0,0,0.18);
            white-space: nowrap;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s;
        }

        .custom-dorm-marker.white-dorm {
            border-color: #059669;
            color: #065f46;
        }

        .custom-dorm-marker:hover {
            transform: translate(-50%, -50%) scale(1.12);
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            z-index: 9999 !important;
        }

        /* หมุดประตูมหาวิทยาลัย & สถานที่สำคัญ */
        .custom-gate-marker {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #0a1931;
            color: #fef08a;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            border: 2px solid #93c5fd;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            white-space: nowrap;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: transform 0.2s;
        }

        .custom-gate-marker:hover {
            transform: translate(-50%, -50%) scale(1.12);
            z-index: 9999 !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }

        @keyframes ping {
            75%, 100% { transform: scale(2); opacity: 0; }
        }
    </style>

            }
            if (val.startsWith('dorm_')) {

                const dorm = dormitories.find(d => String(d.id) === dId);
                return dorm ? { lat: Number(dorm.lat || dorm.latitude), lng: Number(dorm.lng || dorm.longitude), name: dorm.name, icon: dorm.isWhiteDorm ? '🛡️' : '🏠' } : null;

        async function calculateMultiColorRouteLegs() {
            const originPt = resolvePoint(originValue);
            if (!originPt) return;

            // รวบรวม Waypoints ตามลำดับ: [Origin, Stop 1, Stop 2, Stop 3, ...]
            const waypoints = [originPt];

            const legPromises = [];

                            const coords = r.geometry.coordinates.map(c => [c[1], c[0]]);
                            const km = parseFloat((r.distance / 1000).toFixed(1));
                            const duration = Math.max(r.duration, (r.distance / 1000 / 28) * 3600);
                            const mins = Math.max(1, Math.round(duration / 60));

                            return {
                                legIndex: i,
                                coords,
                                km,
                                mins,
                                duration,
                                colorMeta
                            };
                        }
                        throw new Error('OSRM Error');
                    })
                    .catch(err => {

                leg.coords.forEach(c => allLegCoords.push(c));
            });

            // ปรับระยะ FitBounds ให้เห็นครบทุกช่วง (ถ้าผู้ใช้ไม่ได้กำลังลากแผนที่)
            const isInteracting = map.dragging && map.dragging.moving();
            if (allLegCoords.length > 1 && !isInteracting) {
                map.fitBounds(L.latLngBounds(allLegCoords), { padding: [70, 70], maxZoom: 17 });
            }

            currentTotalKm = sumKm.toFixed(1);
            currentTotalMins = Math.max(1, Math.round(sumSecs / 60));

            renderDestinationsUI();
            updateTotalSummaryCard();
        }

        // 7. เติมตัวเลือกลงใน Origin Select
        const originSelect = document.getElementById('origin-select');
        function buildOptionsHTML(selectedVal) {
            let html = '';
            html += '<optgroup label="📡 ตำแหน่งปัจจุบัน">';
            html += '<option value="gps"' + (selectedVal === 'gps' ? ' selected' : '') + '>📡 ตำแหน่ง GPS</option>';
            html += '</optgroup>';

            html += '<optgroup label="🏛️ ประตูมหาวิทยาลัยและสถานที่สำคัญ">';
            ubuGates.forEach(g => {
                const val = 'gate_' + g.id;
                html += '<option value="' + val + '"' + (selectedVal === val ? ' selected' : '') + '>' + (g.icon || '🏛️') + ' ' + g.name + '</option>';
            });
            html += '</optgroup>';

            html += '<optgroup label="🏠 หอพักเครือข่าย (60 แห่ง)">';
            dormitories.forEach(d => {
                const val = 'dorm_' + d.id;
                html += '<option value="' + val + '"' + (selectedVal === val ? ' selected' : '') + '>' + (d.isWhiteDorm ? '🛡️ ' : '🏠 ') + d.name + '</option>';
            });
            html += '</optgroup>';
            return html;
        }

        function updateOriginUI() {
            originSelect.innerHTML = buildOptionsHTML(originValue);
            const pt = resolvePoint(originValue);
            document.getElementById('origin-label').innerText = 'จุดเริ่มต้น: ' + (pt ? pt.name : 'GPS');
        }

        window.onOriginSelectChanged = function(val) {
            originValue = val;
            updateOriginUI();
            calculateMultiColorRouteLegs();
        };

        // 8. การจัดการ UI จุดหมายปลายทาง 1-4 จุด (แยกสี Badge และ Numbered Circle ตามสีเส้นทาง)
        function renderDestinationsUI() {
            const container = document.getElementById('destinations-container');
            container.innerHTML = '';

            const count = destinationValues.length;
            document.getElementById('header-dest-count').innerText = 'เปรียบเทียบระยะทาง (' + count + '/4 จุดหมาย)';
            document.getElementById('btn-add-count').innerText = '(' + count + '/4)';

            const btnAdd = document.getElementById('btn-add-destination');
            if (count >= 4) {
                btnAdd.classList.add('opacity-50', 'pointer-events-none');
            } else {
                btnAdd.classList.remove('opacity-50', 'pointer-events-none');
            }

            destinationValues.forEach((val, idx) => {
                const colorMeta = LEG_COLORS[idx % LEG_COLORS.length];
                const legStat = legStatsMap[idx];
                const effectiveMins = legStat 
                    ? (travelMode === 'motorcycle' ? Math.max(1, Math.round(legStat.mins * 0.85)) : legStat.mins)
                    : null;

                const row = document.createElement('div');
                row.className = `dest-row-item flex items-center justify-between border ${colorMeta.border} ${colorMeta.lightBg} rounded-xl p-2 focus-within:ring-2 focus-within:ring-blue-400 transition shadow-2xs cursor-pointer select-none`;
                row.setAttribute('data-idx', idx);
                
                // Add event handlers for interactive highlighting
                row.onmouseenter = () => window.highlightLeg(idx);
                row.onmouseleave = () => window.unhighlightLeg(idx);
                row.onclick = () => window.highlightLeg(idx);

                row.innerHTML = `
                    <div class="flex items-center flex-grow min-w-0 pr-2">
                        <!-- หมายเลขลำดับจุดหมาย ตามสีเส้นทาง -->
                        <div class="flex items-center justify-center w-6 h-6 rounded-full text-white font-black mr-2 text-xs flex-shrink-0 shadow-xs" style="background-color: ${colorMeta.color}">
                            ${idx + 1}
                        </div>
                        <select onchange="onDestinationChanged(${idx}, this.value)" class="bg-transparent border-none outline-none text-slate-800 font-extrabold w-full text-xs sm:text-sm truncate cursor-pointer z-[9999]" style="z-index: 9999 !important;">
                            ${buildOptionsHTML(val)}
                        </select>
                    </div>
                    <div class="flex items-center gap-1.5 flex-shrink-0">
                        <!-- ป้าย Badge แสดงระยะทางและเวลาเฉพาะของช่วงนี้ ตามสีของเส้นทาง -->
                        <div class="bg-white border ${colorMeta.border} ${colorMeta.text} px-2 py-1 rounded-lg text-xs font-black whitespace-nowrap shadow-xs">
                            ${legStat && effectiveMins !== null 
                                ? (travelMode === 'driving' ? '🚗 ' : '🚲 ') + legStat.km + ' กม. (~' + effectiveMins + ' น.)' 
                                : '<span class="text-slate-400 text-[10px]">คำนวณ...</span>'}
                        </div>
                        ${count > 1 ? `
                            <button onclick="event.stopPropagation(); removeDestination(${idx})" class="p-1 rounded-full text-slate-400 hover:text-rose-600 hover:bg-white transition cursor-pointer" title="ลบจุดนี้">
                                ✕
                            </button>
                        ` : ''}
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // Toggle Minimize/Collapse for comparison card
        window.toggleMinimizeCompare = function() {
            isComparePanelMinimized = !isComparePanelMinimized;
            const contents = document.getElementById('compare-contents');
            const btn = document.getElementById('btn-minimize-compare');
            const header = document.getElementById('compare-header');
            
            if (isComparePanelMinimized) {
                contents.classList.add('hidden');
                btn.innerText = '➕';
                btn.title = 'ขยายเนื้อหา';
                header.classList.remove('mb-3', 'pb-2', 'border-b', 'border-slate-100');
            } else {
                contents.classList.remove('hidden');
                btn.innerText = '➖';
                btn.title = 'ย่อเนื้อหา';
                header.classList.add('mb-3', 'pb-2', 'border-b', 'border-slate-100');
            }
        };

        // Highlight route leg polylines and list items
        window.highlightLeg = function(idx) {
            Object.keys(legPolylines).forEach(key => {
                const legId = parseInt(key);
                const { halo, core, colorMeta } = legPolylines[legId];
                if (legId === idx) {
                    halo.setStyle({ weight: 12, opacity: 0.6 });
                    core.setStyle({ weight: 9, opacity: 0.95 });
                    core.bringToFront();
                } else {
                    halo.setStyle({ weight: 8, opacity: 0.25 });
                    core.setStyle({ weight: 5.5, opacity: 0.6 });
                }
            });

            const rows = document.querySelectorAll('.dest-row-item');
            rows.forEach(row => {
                const rowIdx = parseInt(row.getAttribute('data-idx'));
                if (rowIdx === idx) {
                    row.className = `dest-row-item flex items-center justify-between border border-indigo-400 bg-indigo-50/70 ring-2 ring-indigo-400 shadow-sm rounded-xl p-2 transition cursor-pointer select-none`;
                } else {
                    const colorMeta = LEG_COLORS[rowIdx % LEG_COLORS.length];
                    row.className = `dest-row-item flex items-center justify-between border ${colorMeta.border} ${colorMeta.lightBg} hover:bg-slate-50 hover:border-slate-300 rounded-xl p-2 transition shadow-2xs cursor-pointer select-none`;
                }
            });
        };

        window.unhighlightLeg = function(idx) {
            Object.keys(legPolylines).forEach(key => {
                const legId = parseInt(key);
                const { halo, core } = legPolylines[legId];
                halo.setStyle({ weight: 8, opacity: 0.25 });
                core.setStyle({ weight: 5.5, opacity: 0.6 });
            });

            const rows = document.querySelectorAll('.dest-row-item');
            rows.forEach(row => {
                const rowIdx = parseInt(row.getAttribute('data-idx'));
                const colorMeta = LEG_COLORS[rowIdx % LEG_COLORS.length];
                row.className = `dest-row-item flex items-center justify-between border ${colorMeta.border} ${colorMeta.lightBg} rounded-xl p-2 transition shadow-2xs cursor-pointer select-none`;
            });
        };

        window.onDestinationChanged = function(index, val) {
            destinationValues[index] = val;
            calculateMultiColorRouteLegs();
        };

        window.addNewDestination = function() {
            if (destinationValues.length >= 4) return;
            const nextGate = ubuGates[destinationValues.length % ubuGates.length];
            destinationValues.push('gate_' + nextGate.id);
            renderDestinationsUI();
            calculateMultiColorRouteLegs();
        };

        window.removeDestination = function(index) {
            if (destinationValues.length <= 1) return;
            destinationValues.splice(index, 1);
            renderDestinationsUI();
            calculateMultiColorRouteLegs();
        };

        window.setTravelMode = function(mode) {
            travelMode = mode;
            if (mode === 'driving') {
                document.getElementById('btn-mode-car').className = 'bg-slate-900 text-yellow-400 px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1 cursor-pointer transition';
                document.getElementById('btn-mode-moto').className = 'text-gray-400 px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1 cursor-pointer transition';
            } else {
                document.getElementById('btn-mode-car').className = 'text-gray-400 px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1 cursor-pointer transition';
                document.getElementById('btn-mode-moto').className = 'bg-slate-900 text-yellow-400 px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1 cursor-pointer transition';
            }
            renderDestinationsUI();
            updateTotalSummaryCard();
        };

        function updateTotalSummaryCard() {
            const effectiveTotalMins = travelMode === 'motorcycle' 
                ? Math.max(1, Math.round(currentTotalMins * 0.85)) 
                : currentTotalMins;

            document.getElementById('route-time').innerText = effectiveTotalMins + ' นาที';
            document.getElementById('route-distance').innerText = currentTotalKm + ' กม. (' + (travelMode === 'driving' ? 'ขับรถยนต์' : 'ขี่มอเตอร์ไซค์') + ' รวม ' + destinationValues.length + ' ช่วงเดินทาง)';
        }

        // 9. วนลูปสร้างหมุดประตูและหอพัก
        const dormMarkersMap = {};
        ubuGates.forEach(gate => {
            const gateIcon = L.divIcon({
                className: '',
                html: `<div class="custom-gate-marker">${gate.icon || '🏛️'} ${gate.name}</div>`,
                iconSize: [1, 1],
                iconAnchor: [0, 0]
            });
            const marker = L.marker([gate.lat, gate.lng], { icon: gateIcon }).addTo(map);
            marker.bindPopup(`
                <div style="font-family: 'Sarabun', sans-serif; text-align: center;">
                    <b>${gate.name}</b><br>
                    <button onclick="addStopFromMap('gate_${gate.id}')" style="margin-top: 6px; background: #2563eb; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;">+ เพิ่มในเส้นทาง</button>
                </div>
            `);
        });

        dormitories.forEach(dorm => {
            const isWhite = Boolean(dorm.isWhiteDorm || dorm.status === 'ผ่าน');
            const iconHtml = `<div class="custom-dorm-marker ${isWhite ? 'white-dorm' : ''}">${isWhite ? '🛡️' : '🏠'} ${dorm.name}</div>`;
            const dormIcon = L.divIcon({
                className: '',
                html: iconHtml,
                iconSize: [1, 1],
                iconAnchor: [0, 0]
            });
            const marker = L.marker([dorm.lat, dorm.lng], { icon: dormIcon }).addTo(map);
            dormMarkersMap[dorm.id] = { marker, dorm };
            marker.bindPopup(`
                <div style="font-family: 'Sarabun', sans-serif; text-align: center; min-width: 170px;">
                    <b>${dorm.name}</b><br>
                    <span style="font-size: 11px; color: ${isWhite ? '#059669' : '#d97706'}; font-weight: bold;">${isWhite ? '🛡️ หอพักสีขาว' : '🏠 หอพักทั่วไป'}</span><br>
                    <button onclick="addStopFromMap('dorm_${dorm.id}')" style="margin-top: 6px; background: #2563eb; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;">+ เพิ่มในเส้นทาง</button>
                </div>
            `);
        });

        window.addStopFromMap = function(val) {
            if (destinationValues.length < 4) {
                destinationValues.push(val);
            } else {
                destinationValues[destinationValues.length - 1] = val;
            }
            renderDestinationsUI();
            calculateMultiColorRouteLegs();
        };

        // 10. ระบบ Drawer หอพัก
        let isWhiteOnlyFilter = false;
        let currentZoneFilter = 'all';

        function toggleDormDrawer() {
            document.getElementById('dorm-drawer').classList.toggle('translate-x-full');
        }

        function toggleWhiteFilter() {
            isWhiteOnlyFilter = !isWhiteOnlyFilter;
            const btn = document.getElementById('btn-white-filter');
            btn.className = isWhiteOnlyFilter
                ? 'px-3 py-2 bg-emerald-600 text-white border border-emerald-400 rounded-2xl text-xs font-black shadow-lg transition active:scale-95 flex items-center gap-1.5 cursor-pointer'
                : 'px-3 py-2 bg-white/95 backdrop-blur-md hover:bg-white text-slate-800 border border-slate-200/90 rounded-2xl text-xs font-black shadow-lg transition active:scale-95 flex items-center gap-1.5 cursor-pointer';
            renderDormList();
        }

        function setZoneFilter(zone) {
            currentZoneFilter = zone;
            document.querySelectorAll('.zone-btn').forEach(btn => {
                if (btn.innerText.includes(zone === 'all' ? 'ทุกโซน' : zone)) {
                    btn.className = 'zone-btn px-2.5 py-1 rounded-lg bg-[#0a1931] text-amber-300 whitespace-nowrap transition cursor-pointer font-bold';
                } else {
                    btn.className = 'zone-btn px-2.5 py-1 rounded-lg bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 whitespace-nowrap transition cursor-pointer font-bold';
                }
            });
            renderDormList();
        }

        function renderDormList() {
            const searchKeyword = (document.getElementById('drawer-search').value || '').toLowerCase();
            const container = document.getElementById('dorm-list-container');
            container.innerHTML = '';

            const filtered = dormitories.filter(d => {
                if (isWhiteOnlyFilter && !d.isWhiteDorm) return false;
                if (currentZoneFilter !== 'all' && !(d.zone || '').includes(currentZoneFilter)) return false;
                if (searchKeyword && !d.name.toLowerCase().includes(searchKeyword)) return false;
                return true;
            });

            document.getElementById('header-badge').innerText = filtered.length;

            filtered.forEach(d => {
                const isWhite = Boolean(d.isWhiteDorm);
                const card = document.createElement('div');
                card.className = 'pt-2.5 pb-2 flex flex-col gap-1.5';
                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div>
                            <h3 class="font-extrabold text-xs text-[#0a1931]">${d.name}</h3>
                            <p class="text-[11px] text-slate-400 font-medium">โซน: ${d.zone || 'รอบ ม.อุบลฯ'}</p>
                        </div>
                        <span class="text-xs font-black text-amber-600">฿${Number(d.minPrice || 3000).toLocaleString()}</span>
                    </div>
                    <div class="flex items-center justify-between pt-1">
                        <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${isWhite ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-slate-100 text-slate-600'}">
                            ${isWhite ? '🛡️ หอพักสีขาว' : '🏠 หอพักทั่วไป'}
                        </span>
                        <button onclick="addStopFromMap('dorm_${d.id}'); toggleDormDrawer();" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-[11px] font-extrabold shadow-xs transition active:scale-95 cursor-pointer">
                            + นำทาง
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // เริ่มต้นการทำงานทั้งหมด
        updateOriginUI();
        renderDestinationsUI();
        renderDormList();
        calculateMultiColorRouteLegs();
    </script>
</body>
</html>
